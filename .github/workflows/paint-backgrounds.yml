name: Paint backgrounds

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Pictures per place"
        type: string
        default: "3"
      only:
        description: "Only these places, comma separated (empty = all)"
        type: string
        default: ""
      wide:
        description: "Widescreen 16:9 ones, for the weekly long video"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Paint the missing backgrounds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VARIANTS: ${{ inputs.variants }}
          ONLY: ${{ inputs.only }}
          WIDE: ${{ inputs.wide }}
        run: python -m tools.paint_backgrounds
      - name: Keep them in the repo
        if: always()
        run: |
          git config user.name "shorts-agent"
          git config user.email "shorts-agent@users.noreply.github.com"
          git add assets/backgrounds
          git diff --cached --quiet || (git commit -m "Paint backgrounds [skip ci]" && git pull --rebase && git push)
