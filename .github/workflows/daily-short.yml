name: Daily Short

on:
  schedule:
    # Made ~3 hours early; YouTube then publishes at config youtube.publish_times (9am and 5pm Eastern).
    # Cron is UTC: 11:00 and 19:00 UTC are 6am and 2pm Eastern in winter (7am and 3pm in summer).
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:         # lets you trigger a run by hand from the Actions tab
    inputs:
      dry_run:
        description: "Make the video but don't upload it"
        type: boolean
        default: true
      topic:
        description: "Topic (optional), e.g. why cats purr. Empty lets the agent pick."
        type: string
        default: ""
      publish_at:
        description: "Go public at this time (Eastern, e.g. 20:00, or now). Empty keeps a hand-started upload private."
        type: string
        default: ""
      remake_from_run:
        description: "Remake an earlier run's video with the current look (same script; its run ID)"
        type: string
        default: ""
      upload_from_run:
        description: "Upload the video an earlier run made instead (its run ID from the Actions page URL)"
        type: string
        default: ""

permissions:
  contents: write            # to commit history.json so facts never repeat
  actions: read              # to fetch an earlier run's video

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji
      - run: pip install -r requirements.txt
      - name: Fetch the earlier run's video
        if: inputs.upload_from_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.upload_from_run }}
          github-token: ${{ github.token }}
          path: saved/
      - name: Fetch the earlier run's script
        if: inputs.remake_from_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.remake_from_run }}
          github-token: ${{ github.token }}
          path: remake/
      - name: Upload the earlier run's video
        if: inputs.upload_from_run != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: python -m tools.upload_saved saved/
      - name: Make and upload today's Short
        if: inputs.upload_from_run == ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TOPIC: ${{ inputs.topic }}
          PUBLISH_ON_SCHEDULE: ${{ github.event_name == 'schedule' }}
          PUBLISH_AT: ${{ inputs.publish_at }}
          SCRIPT_FILE: ${{ inputs.remake_from_run != '' && 'remake/script.json' || '' }}
        run: |
          if [ -n "$SCRIPT_FILE" ]; then SCRIPT_FILE=$(find remake -name script.json | head -1); export SCRIPT_FILE; fi
          python -m agent.main ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Keep the video so you can watch it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            output/
            !output/emoji/
          retention-days: 14
      - name: Remember the voice, sounds and which facts were used
        if: always()
        run: |
          git config user.name "shorts-agent"
          git config user.email "shorts-agent@users.noreply.github.com"
          git add -A history.json voices.json topics.txt assets
          git diff --cached --quiet || (git commit -m "Log today's Short [skip ci]" && git push)
