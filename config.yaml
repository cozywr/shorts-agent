# Daily silly fun-fact Shorts for kids: Claude writes a true, weird fact as a goofy cartoon script,
# our stickman host (red cap) acts it out (fainting, running, laughing) with big pictures, speech bubbles,
# cartoon sound effects and happy music, an excited cartoon narrator reads it,
# and big captions light up word by word.

facts:
  model: claude-opus-5-5
  min_words: 85
  max_words: 115          # about 40 seconds read aloud

narrator:
  name: Fun Facts Narrator
  # To use a voice picked from the "Voice samples" run, set voice_id and library_owner_id
  # from its line in voices.txt. Otherwise a voice is designed from the description below.
  voice: A goofy, high-energy cartoon narrator, playful and over-the-top excited, perfect for kids' comedy
  voice_id: eh3mW70o6niXfNTuBPbY          # Georgee (energetic goofy cartoon narrator), from Voice samples run 4
  library_owner_id: 3cffc638a198a148a8fcc1615b892170acba9b17feba79bf45ac54fb05b44f28
  model: eleven_v3        # the most expressive voice model; falls back to eleven_multilingual_v2
  # How words are read aloud, if the narrator gets one wrong (written: spoken).
  say_as: {}

video:
  speed: 1.0              # narration speed (1 = as recorded); captions stay in sync
  max_seconds: 60
  music_volume: 0.12      # background music under the voice (0 turns it off)
  effects_volume: 0.6     # cartoon sound effects

youtube:
  # "private" lets you review each Short in YouTube Studio before publishing.
  # Switch to "public" once you trust the output.
  privacy: private
  category_id: "27"       # Education
  made_for_kids: true     # required for videos aimed at kids: turns off comments and personalised ads
