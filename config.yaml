# Daily fun-fact Shorts for kids: Claude writes a true, kid-friendly fact as a little cartoon script,
# our stickman host (red cap) acts it out with big pictures, a cheerful narrator reads it,
# and big captions light up word by word.

facts:
  model: claude-opus-5-5
  min_words: 80
  max_words: 110          # about 40 seconds read aloud

narrator:
  name: Fun Facts Narrator
  # To use a voice picked from the "Voice samples" run, set voice_id and library_owner_id
  # from its line in voices.txt. Otherwise a voice is designed from the description below.
  voice: A warm, cheerful, upbeat female voice, American accent, friendly like a fun teacher talking to young kids, clear and expressive
  voice_id: 19STyYD15bswVz51nqLf          # Samara X for now; pick a kid-friendly voice with Voice samples
  library_owner_id: 6643afd1d55a6987b18e340e00bb89ed60329c878a01823e0c10a50fb522bd76
  # How words are read aloud, if the narrator gets one wrong (written: spoken).
  say_as: {}

video:
  speed: 1.0              # narration speed (1 = as recorded); captions stay in sync
  max_seconds: 60

youtube:
  # "private" lets you review each Short in YouTube Studio before publishing.
  # Switch to "public" once you trust the output.
  privacy: private
  category_id: "27"       # Education
  made_for_kids: true     # required for videos aimed at kids: turns off comments and personalised ads
