# Daily cartoon-parody Shorts: famous movie/TV scenes re-enacted by ORIGINAL cartoon characters.
# Characters and voices here are our own creations, so every frame and voice on the channel is ours.
# Each `voice` is designed once in ElevenLabs from its description; the IDs are saved in voices.json.
# To redesign a voice, change its description and delete its entry from voices.json.

style: >
  bright 2D cartoon, thick black outlines, flat saturated colors, expressive faces,
  Saturday-morning animation look, vertical 9:16 composition, no text or logos in the image

characters:
  pete:
    name: Pickle Pete
    look: an anxious green pickle with stubby arms, huge watery eyes and a tiny red necktie
    personality: nervous, fast-talking, always in over his head
    voice: A young male cartoon voice, high-pitched, nervous and jittery, talks fast and stammers, comedic and friendly
  muffin:
    name: Big Mama Muffin
    look: a large blueberry muffin with a paper-cup skirt, gold hoop earrings and sunglasses
    personality: calm, terrifying boss energy, deep slow voice
    voice: A mature female cartoon voice, very deep, slow and calm, smoky and quietly menacing like a crime boss, comedic
  waddles:
    name: Sir Waddles
    look: a plump penguin wearing a monocle and a too-small top hat
    personality: pompous, theatrical, overly dramatic British narrator type
    voice: An older male voice with a posh British accent, pompous and theatrical, booming and overly dramatic, comedic
  zip:
    name: Zip
    look: a tiny orange hamster with a lightning-bolt patch of fur and oversized sneakers
    personality: hyperactive, squeaky, misunderstands everything
    voice: A tiny squeaky cartoon voice, extremely energetic and hyper, fast excited speech, playful and silly

script:
  model: claude-opus-5-5
  min_shots: 6
  max_shots: 9
  max_words: 120          # ~45 seconds of speech

video:
  max_seconds: 59
  pause_between_lines: 0.3

youtube:
  # "private" lets you review each Short in YouTube Studio before publishing.
  # Switch to "public" once you trust the output (and your API project has passed YouTube's audit).
  privacy: private
  category_id: "23"       # Comedy
